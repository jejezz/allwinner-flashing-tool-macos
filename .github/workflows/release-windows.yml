name: Release · Windows

# Builds the Inno Setup installer and publishes it to a GitHub Release, by
# calling scripts/release-windows.ps1 — see docs/release-ci.md. Runs off the
# same tag as Release · macOS but does not depend on it: whichever job's
# `gh release create` lands first owns the release, the other just uploads
# its own assets to it (see the wait/retry in the script).
#
# Bump the version in Cargo.toml and gui/pubspec.yaml *before* tagging — the
# tag only names the GitHub release and the installer's displayed version,
# it doesn't drive the Flutter/Rust build's own version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.2). Created and pushed if it doesn't exist yet."
        required: true
        type: string
      publish:
        description: "Publish immediately instead of leaving a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ steps.vars.outputs.publish }}" -eq "true") {
            .\scripts\release-windows.ps1 "${{ steps.vars.outputs.tag }}" -Publish
          } else {
            .\scripts\release-windows.ps1 "${{ steps.vars.outputs.tag }}"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.vars.outputs.tag }}
          path: dist/*
