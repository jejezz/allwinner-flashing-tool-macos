name: Release · macOS

# Builds the ad-hoc-signed .app + CLI tarball and publishes them to a GitHub
# Release, by calling the same scripts/release.sh a developer runs locally —
# see docs/release-ci.md. Apple Silicon (arm64) only, see
# gui/macos/Runner/Configs/Release.xcconfig.
#
# Bump the version in Cargo.toml and gui/pubspec.yaml *before* tagging — the
# tag only names the GitHub release, it doesn't drive the build's version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.2). Created and pushed if it doesn't exist yet."
        required: true
        type: string
      publish:
        description: "Publish immediately instead of leaving a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # A recent runner — some dependencies need an Xcode SDK newer than older
    # runner images default to.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: gui
        run: flutter pub get

      - name: Determine tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.vars.outputs.publish }}" == "true" ]]; then
            ./scripts/release.sh "${{ steps.vars.outputs.tag }}" --publish
          else
            ./scripts/release.sh "${{ steps.vars.outputs.tag }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ steps.vars.outputs.tag }}
          path: dist/*
